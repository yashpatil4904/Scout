version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend && npm ci
    build:
      commands:
        - cd frontend && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - "**/*"
  cache:
    paths:
      - frontend/node_modules/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: "Cache-Control"
          value: "public,max-age=0,must-revalidate"
# Set Amplify env before Git builds:
#   VITE_API_URL = https://xxxx.execute-api.us-east-1.amazonaws.com
#   VITE_AGENT_URL = http://127.0.0.1:9877
